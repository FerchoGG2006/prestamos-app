name: Expo EAS Sync & Build

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Acción a ejecutar en Expo (update OTA o compilar APK)'
        required: true
        default: 'update'
        type: choice
        options:
          - update
          - build-preview-apk
          - build-production-aab

jobs:
  eas:
    name: Sync with expo.dev (cartera-movil)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository (FerchoGG2006/prestamos-app)
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Publish EAS Update (OTA) & iPhone WebClip Deploy on push or manual trigger
        if: github.event_name == 'push' || github.event.inputs.action == 'update'
        env:
          EAS_SKIP_AUTO_FINGERPRINT: '1'
        run: |
          npx eas-cli update --branch preview --environment preview --message "${{ github.event.head_commit.message || 'Manual OTA Update' }}" --non-interactive
          npx eas-cli update --branch production --environment production --message "${{ github.event.head_commit.message || 'Manual OTA Update' }}" --non-interactive
          npx expo export -p web
          cp public/apple-touch-icon.png dist/apple-touch-icon.png
          cp public/manifest.json dist/manifest.json
          npx eas-cli deploy --prod --non-interactive

      - name: Trigger EAS Preview APK Build
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'build-preview-apk'
        run: npx eas-cli build --platform android --profile preview --non-interactive --no-wait

      - name: Trigger EAS Production AAB Build
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'build-production-aab'
        run: npx eas-cli build --platform android --profile production --non-interactive --no-wait
