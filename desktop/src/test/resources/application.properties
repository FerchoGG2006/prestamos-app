spring.main.web-application-type=none
# Isolated throwaway database: tests must NEVER touch ~/.sistema-cartera/cartera.db
spring.datasource.url=jdbc:sqlite:${java.io.tmpdir}/cartera-test-${random.uuid}.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys = ON;
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
cartera.demo-data.enabled=true
