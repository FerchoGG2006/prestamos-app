spring.main.web-application-type=none
spring.main.banner-mode=off
spring.main.log-startup-info=false
logging.level.root=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.flywaydb=WARN
logging.file.name=${user.home}/.sistema-cartera/logs/cartera.log
spring.datasource.url=jdbc:sqlite:${user.home}/.sistema-cartera/cartera.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys = ON;
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Demo seed data (fictitious customers/loans). Set to false once real data is loaded.
cartera.demo-data.enabled=false
