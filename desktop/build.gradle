plugins {
    id 'java'
    id 'application'
    id 'eclipse'
    id 'org.springframework.boot' version '3.4.13'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.cartera'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

javafx {
    version = '21.0.6'
    modules = [ 'javafx.controls', 'javafx.fxml' ]
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring is local infrastructure only; this project deliberately has no web starter.
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.hibernate.orm:hibernate-community-dialects'
    implementation 'org.flywaydb:flyway-core'
    // implementation 'org.flywaydb:flyway-database-sqlite'
    implementation 'org.xerial:sqlite-jdbc:3.49.1.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

application {
    mainClass = 'com.cartera.ui.CarteraMain'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('packageWindows') {
    dependsOn 'installDist'
    description = 'Generates standalone Windows application image using jpackage'
    group = 'distribution'

    doLast {
        def distDir = file("${rootDir}/dist")
        def appDir = file("${distDir}/SistemaCartera")
        if (appDir.exists()) {
            delete(appDir)
        }
        distDir.mkdirs()

        exec {
            commandLine 'jpackage',
                    '--type', 'app-image',
                    '--name', 'SistemaCartera',
                    '--input', "${layout.buildDirectory.get().asFile}/install/sistema-cartera-desktop/lib",
                    '--main-jar', 'sistema-cartera-desktop-0.1.0-SNAPSHOT-plain.jar',
                    '--main-class', 'com.cartera.ui.CarteraMain',
                    '--icon', "${projectDir}/src/main/resources/ui/app.ico",
                    '--dest', "${rootDir}/dist",
                    '--vendor', 'Cartera Software',
                    '--app-version', '1.0.0',
                    '--add-modules', 'java.se,jdk.unsupported,jdk.crypto.ec',
                    '--java-options', '-Dfile.encoding=UTF-8'
        }

        copy {
            from "${projectDir}/packaging/windows"
            into "${rootDir}/dist/SistemaCartera"
        }
    }
}

tasks.register('packageZip', Zip) {
    dependsOn 'packageWindows'
    description = 'Zips the standalone Windows package into a downloadable archive'
    group = 'distribution'

    archiveFileName = 'SistemaCartera-v1.0.0-Windows-x64.zip'
    destinationDirectory = file("${rootDir}/dist")

    from("${rootDir}/dist/SistemaCartera") {
        into 'SistemaCartera'
    }
}

tasks.register('packageInstaller') {
    dependsOn 'packageWindows'
    description = 'Compiles official Windows setup installer executable using Inno Setup'
    group = 'distribution'

    doLast {
        def isccPath = "C:\\Users\\ASUS\\AppData\\Local\\Programs\\Antigravity IDE\\resources\\app\\node_modules\\innosetup\\bin\\ISCC.exe"
        exec {
            commandLine isccPath, "${projectDir}/packaging/windows/installer.iss"
        }
    }
}

tasks.register('packageAll') {
    dependsOn 'packageZip', 'packageInstaller'
    description = 'Generates both the portable ZIP and the official Setup EXE installer'
    group = 'distribution'
}


