plugins {
    id 'java'
    id 'application'
    id 'eclipse'
    id 'org.springframework.boot' version '3.4.13'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.cartera'
version = '0.1.0-SNAPSHOT'

if (providers.gradleProperty('isolatedBuildDir').isPresent()) {
    layout.buildDirectory.set(file(providers.gradleProperty('isolatedBuildDir').get()))
}
def releaseDir = file(providers.gradleProperty('distributionDir').getOrElse("${rootDir}/dist/releases/1.1.1"))

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

javafx {
    version = '21.0.6'
    modules = [ 'javafx.controls', 'javafx.fxml' ]
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring is local infrastructure only; this project deliberately has no web starter.
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.hibernate.orm:hibernate-community-dialects'
    implementation 'org.flywaydb:flyway-core'
    // implementation 'org.flywaydb:flyway-database-sqlite'
    implementation 'org.xerial:sqlite-jdbc:3.49.1.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

application {
    mainClass = 'com.cartera.ui.CarteraMain'
    applicationDefaultJvmArgs = [
        '-Dfile.encoding=UTF-8',
        '-Duser.timezone=America/Bogota',
        '-Duser.language=es',
        '-Duser.country=CO'
    ]
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'user.timezone', 'America/Bogota'
    systemProperty 'user.language', 'es'
    systemProperty 'user.country', 'CO'
}

tasks.register('renewalPreviewDemo', JavaExec) {
    dependsOn 'testClasses'
    group = 'verification'
    description = 'Opens the native renewal summary against a new isolated demo database'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.cartera.renewals.ui.RenewalPreviewDemo'
    jvmArgs '-Dfile.encoding=UTF-8', '-Duser.timezone=America/Bogota'
}

tasks.register('officeQa', JavaExec) {
    dependsOn 'testClasses'
    group = 'verification'
    description = 'Opens the full native product in a new fictitious, isolated QA office'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.cartera.qa.OfficeQaLauncher'
    workingDir rootDir
    jvmArgs '-Dfile.encoding=UTF-8', '-Duser.timezone=America/Bogota'
}

tasks.register('officeJourneyQa', JavaExec) {
    dependsOn 'testClasses'
    group = 'verification'
    description = 'Executes diagnostic financial journeys in an isolated fictitious office and records PASS/FAIL evidence'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.cartera.qa.OfficeJourneyQa'
    workingDir rootDir
    jvmArgs '-Dfile.encoding=UTF-8', '-Duser.timezone=America/Bogota'
}

tasks.register('packageWindows') {
    dependsOn 'installDist', 'test'
    description = 'Generates standalone Windows application image using jpackage'
    group = 'distribution'

    doLast {
        def distDir = releaseDir
        def appDir = file("${distDir}/SistemaCartera")
        if (appDir.exists()) {
            throw new GradleException('Release output already exists. Choose a NEW -PdistributionDir; existing packages are preserved.')
        }
        distDir.mkdirs()

        exec {
            commandLine 'jpackage',
                    '--type', 'app-image',
                    '--name', 'SistemaCartera',
                    '--input', new File(tasks.named('installDist').get().destinationDir, 'lib').absolutePath,
                    '--main-jar', tasks.named('jar').get().archiveFileName.get(),
                    '--main-class', 'com.cartera.ui.CarteraMain',
                    '--icon', "${projectDir}/src/main/resources/ui/app.ico",
                    '--dest', releaseDir.absolutePath,
                    '--vendor', 'Cartera Software',
                    '--app-version', '1.1.1',
                    '--add-modules', 'java.se,jdk.unsupported,jdk.crypto.ec,jdk.httpserver',
                    '--java-options', '-Dfile.encoding=UTF-8',
                    '--java-options', '-Duser.timezone=America/Bogota',
                    '--java-options', '-Duser.language=es',
                    '--java-options', '-Duser.country=CO'
        }

        copy {
            from "${projectDir}/packaging/windows"
            into new File(releaseDir, "SistemaCartera")
        }
    }
}

tasks.register('packageZip', Zip) {
    dependsOn 'packageWindows'
    description = 'Zips the standalone Windows package into a downloadable archive'
    group = 'distribution'

    archiveFileName = 'SistemaCartera-v1.1.1-Windows-x64.zip'
    destinationDirectory = releaseDir

    from(new File(releaseDir,"SistemaCartera")) {
        into 'SistemaCartera'
    }
}

tasks.register('packageInstaller') {
    dependsOn 'packageWindows'
    description = 'Compiles official Windows setup installer executable using Inno Setup'
    group = 'distribution'

    doLast {
        def isccPath = providers.gradleProperty('isccPath').getOrElse(System.getenv('ISCC_EXE') ?: "C:\\Users\\ASUS\\AppData\\Local\\Programs\\Antigravity IDE\\resources\\app\\node_modules\\innosetup\\bin\\ISCC.exe")
        exec {
            commandLine isccPath, "/DSourceDir=${new File(releaseDir,'SistemaCartera').absolutePath}", "/DReleaseDir=${releaseDir.absolutePath}", "${projectDir}/packaging/windows/installer.iss"
        }
    }
}

tasks.register('packageAll') {
    dependsOn 'packageZip', 'packageInstaller'
    description = 'Generates both the portable ZIP and the official Setup EXE installer'
    group = 'distribution'
}

// This launcher always creates an isolated fictitious office.
tasks.register('parityOffice', JavaExec) {
    dependsOn 'testClasses'
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.cartera.qa.ParityQaLauncher'
    workingDir rootDir
    jvmArgs '-Dfile.encoding=UTF-8', '-Duser.timezone=America/Bogota'
}
